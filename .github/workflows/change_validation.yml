name: Change Validation

# Every change is validated here, whichever way it arrives: a pull request runs
# what it affects, and a push to `main` or a manual run validates the whole
# graph. `main`'s run is also what warms the Nx cache every pull request starts
# from.
#
# The Nx cache travels by GitHub alone — `actions/cache` between runs and
# artifacts between the jobs of one run — served to Nx by
# `tools/ci/nx-remote-cache.mjs`. What may read it, and what never does, is
# ADR 0074.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_chunk_size:
        description: 'Projects per test worker'
        required: false
        default: '10'
      app_chunk_size:
        description: 'Services per build worker'
        required: false
        default: '4'

# A pull request's newer push makes its older run worthless, so that one is
# cancelled. A run on `main` never is: a cancelled one would leave the cache
# every pull request reads unsaved.
concurrency:
  group: change-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TEST_CHUNK_SIZE: ${{ github.event.inputs.test_chunk_size || '10' }}
  APP_CHUNK_SIZE: ${{ github.event.inputs.app_chunk_size || '4' }}

jobs:
  # Installs once and saves the result, so every job below restores
  # `node_modules` instead of spending its first half-minute on `pnpm install`.
  initialize:
    name: Initialize
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.shas.outputs.base }}
      head: ${{ steps.shas.outputs.head }}
      lint-projects: ${{ steps.chunks.outputs.lint-projects }}
      lib-projects: ${{ steps.chunks.outputs.lib-projects }}
      app-chunks: ${{ steps.chunks.outputs.app-chunks }}
      test-chunks: ${{ steps.chunks.outputs.test-chunks }}
      e2e-service-projects: ${{ steps.chunks.outputs.e2e-service-projects }}
      e2e-browser-projects: ${{ steps.chunks.outputs.e2e-browser-projects }}
      storybook-projects: ${{ steps.chunks.outputs.storybook-projects }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          install: 'true'
      - name: Resolve affected base/head
        id: shas
        uses: nrwl/nx-set-shas@v5

      # A pull request runs what it affects; `main` runs everything. A pull
      # request that changes CI itself also runs everything: such a change
      # affects no project, so affected-only would skip every matrix and prove
      # the new pipeline on nothing.
      - name: Compute chunks
        id: chunks
        run: |
          # Two Nx invocations, then jq. Each `nx show projects` call builds the
          # project graph again, and one per list was most of this job — the
          # head of every other job's critical path.
          #
          # `tail -n1` is load-bearing: pnpm prints its warnings to STDOUT, so
          # anything it has to say (a deprecated setting, a peer-dependency
          # complaint) lands in front of the JSON and `jq` dies on it —
          # `Invalid numeric literal at line 1, column 6`, which is `[WARN`.
          # nx prints the array as a single last line. A step's default shell is
          # `bash -e`, without `pipefail`, so a failing `nx show projects` piped
          # into `tail` would report `tail`'s success.
          set -o pipefail
          scope=all
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            scope=affected
            if [[ -n "$(git diff --name-only ${{ steps.shas.outputs.base }} ${{ steps.shas.outputs.head }} -- .github tools/ci)" ]]; then
              scope=all
            fi
          fi
          echo "scope: $scope"

          graph="$RUNNER_TEMP/graph.json"
          pnpm nx graph --file="$graph" > /dev/null
          if [[ "$scope" == "affected" ]]; then
            affected=$(pnpm nx show projects --affected \
              --base=${{ steps.shas.outputs.base }} \
              --head=${{ steps.shas.outputs.head }} --json | tail -n1)
          else
            affected=null
          fi
          # The projects in scope with a target, optionally of one type
          # (`app` or `lib`, as `nx show projects --type` reads it), sorted.
          projects() {
            jq -c --argjson affected "$affected" --arg target "$1" --arg type "${2:-}" '
              [.graph.nodes | to_entries[]
                | select($affected == null or (.key as $k | $affected | index($k)))
                | select(.value.data.targets[$target])
                | select($type == "" or .value.type == $type)
                | .key] | sort' "$graph"
          }
          # Whether a project's `$target` runs `$command` (`next build`,
          # `playwright test`), so the heavy ones can be given a runner each.
          runs() {
            jq -c --argjson projects "$1" --arg target "$2" --arg command "$3" '
              [.graph.nodes | to_entries[]
                | select(.key as $k | $projects | index($k))
                | select((.value.data.targets[$target].options.command // "") | startswith($command))
                | .key] | sort' "$graph"
          }
          except() {
            jq -c --argjson drop "$2" '[.[] | select(. as $p | $drop | index($p) | not)]' <<<"$1"
          }
          chunk() {
            jq -c --argjson n "$2" '[range(0; length; $n) as $i | .[$i:$i+$n] | join(",")]' <<<"$1"
          }

          # Assigned before they are echoed, and that is load-bearing: a failure
          # inside `$(…)` in an `echo` argument does not stop the step, so a
          # project graph that fails to build left every list empty, every
          # matrix `skipped`, and the gate free to pass a run in which nothing
          # ran. An assignment's exit status is its substitution's, so `-e`
          # stops here.
          lint=$(projects lint)
          libs=$(projects build lib)
          apps=$(projects build app)
          test=$(projects test)
          e2e=$(projects e2e)
          storybook=$(projects build-storybook)

          # A Next application gets a build runner to itself; the webpack
          # services share them, a few to a runner.
          next=$(runs "$apps" build 'next build')
          services=$(except "$apps" "$next")
          app_chunks=$(jq -c --argjson next "$next" --argjson services "$(chunk "$services" "$APP_CHUNK_SIZE")" -n '$next + $services')

          # A browser suite is one whose `e2e` runs Playwright. It needs a
          # browser and an application build; a service suite needs neither.
          browser=$(runs "$e2e" e2e 'playwright')
          service=$(except "$e2e" "$browser")

          echo "lint-projects=$(jq -r 'join(",")' <<<"$lint")" >> "$GITHUB_OUTPUT"
          echo "lib-projects=$(jq -r 'join(",")' <<<"$libs")" >> "$GITHUB_OUTPUT"
          echo "app-chunks=$app_chunks" >> "$GITHUB_OUTPUT"
          echo "test-chunks=$(chunk "$test" "$TEST_CHUNK_SIZE")" >> "$GITHUB_OUTPUT"
          echo "e2e-service-projects=$(jq -r 'join(",")' <<<"$service")" >> "$GITHUB_OUTPUT"
          echo "e2e-browser-projects=$browser" >> "$GITHUB_OUTPUT"
          # Stories are in no tsconfig project and no spec loads one, so building
          # the Storybook is the only check that compiles them.
          echo "storybook-projects=$(jq -r 'join(",")' <<<"$storybook")" >> "$GITHUB_OUTPUT"

  # One job, not a matrix: lint takes about as long as a runner takes to start.
  lint:
    name: Lint
    needs: initialize
    if: needs.initialize.outputs.lint-projects != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          nx-cache: lint
      - run: pnpm nx run-many -t lint --projects="${{ needs.initialize.outputs.lint-projects }}"
      - if: always() && env.NX_REMOTE_CACHE_NAME != ''
        uses: ./.github/actions/nx-cache-upload

  # The cheap static checks, in one job.
  #
  # NOTE: this job must stay unconditional, and nothing in it may be
  # affected-scoped or read from the cache. A catalog key, a documentation
  # claim, a slice declaration and a convention are claims about the whole
  # repository, so a wrong one is everyone's problem regardless of which
  # project the PR touched. For the same reason the four nx checks run
  # `--skip-nx-cache`: what they read lies outside their own project, so their
  # hash would not move when it changed, and a replayed pass would be a pass
  # nobody earned. Adding an `if:` here would silently make all of them
  # conditional.
  assertions:
    name: Repository assertions
    needs: initialize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # `always()` on every step below, so one failure does not hide the next —
      # otherwise a PR carrying several spends a round trip learning about them
      # one at a time. The job still fails if any step does.
      - name: Check es/en catalog parity
        if: always()
        run: node tools/check-i18n.mjs

      # The other i18n direction: parity says nothing about a code missing from
      # *both* locales, and the render path casts the typed-key gate away, so an
      # uncataloged code reaches the user as its own identifier.
      - name: Check every emitted error code is cataloged
        if: always()
        run: pnpm nx test @r10c/i18n-check --skip-nx-cache

      # The generated documentation blocks: the port table, the store register
      # and the ADR index are written from source, so a hand-edit or a stale
      # block fails here.
      - name: Check generated documentation blocks
        if: always()
        run: node tools/sync-docs.mjs --check

      # The assertions over hand-written prose: link and anchor targets, the
      # router tables, entity names, tag dimensions, fleet ports, and that every
      # ADR supersession was recorded on both records.
      - name: Check documentation claims
        if: always()
        run: pnpm nx test @r10c/docs-check --skip-nx-cache

      # The store register's invariants: one store per domain, one writing slice
      # per store, no app opening a datastore no slice declares, and every
      # `@useCase()` verb granted and reachable from its barrel. Named here
      # rather than left to the affected matrix for the same reason as the two
      # checks above — a slice declaration is a claim about the whole fleet, and
      # a PR that breaks it need not have touched `tools/slices` at all.
      - name: Check the slice register
        if: always()
        run: pnpm nx test @r10c/slices --skip-nx-cache

      # The cluster manifests nothing applies yet (infra/cluster/README.md),
      # checked against their schemas so the shape is right the day one is:
      # core Kubernetes from kubeconform's default location, Gateway API and
      # Envoy Gateway CRDs from the datree catalog at a pinned commit. `-strict`
      # rejects an unknown field, which is how a misspelt timeout would
      # otherwise pass as silently ignored. The binary is checked against the
      # release's own SHA-256 before it runs.
      - name: Validate cluster manifests
        if: always()
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
          CRDS_CATALOG_REF: 63669a570e231d4f1f8396d229a1de512bcf0a34
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
          "$RUNNER_TEMP/kubeconform" -strict -summary \
            -schema-location default \
            -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/$CRDS_CATALOG_REF/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            infra/cluster

      # The repository's own working conventions. Attribution is the first one,
      # and it is here because prose could not hold it: it was written in three
      # places and skipped anyway, in five pull requests and six commits.
      - name: Check repository conventions
        if: always()
        run: pnpm nx test @r10c/conventions --skip-nx-cache

      # The CI cache's own server, which every job above and below trusts.
      - name: The CI scripts
        if: always()
        run: node --test 'tools/ci/*.test.mjs'

      # An accessibility baseline only shrinks (ADR 0075); `A11Y_BASELINE=update`
      # would otherwise let a pull request accept its own regression.
      - name: No accessibility baseline grew
        if: always() && github.event_name == 'pull_request'
        run: node tools/ci/a11y-baseline-growth.mjs ${{ needs.initialize.outputs.base }}

      # The half no git hook can see. A commit message is judged by
      # `.husky/commit-msg` on the machine that writes it; a pull-request body
      # is composed here, after every hook has run, and that is where the
      # attribution line actually landed every time. A push has no body, so
      # the step is a pull request's only.
      - name: Check the pull request body and its commits
        if: always() && github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_SHA: ${{ needs.initialize.outputs.base }}
          PR_HEAD_SHA: ${{ needs.initialize.outputs.head }}
        run: node tools/conventions/check-pull-request.mjs

      # Advisory. Reports code that changed without its documentation being
      # touched, into the job summary. Never blocks: this can only see that a
      # doc was not edited, not that it is wrong, and failing on it would teach
      # everyone to make a trivial edit to whatever file it names.
      - name: Report documentation staleness
        if: always()
        continue-on-error: true
        run: |
          node tools/docs/staleness.mjs \
            --base=${{ needs.initialize.outputs.base }} \
            --head=${{ needs.initialize.outputs.head }}

  # Every library once, on one runner. Their builds are many small swc passes,
  # which suit one machine; what is slow is the applications, which fan out
  # below and read these results instead of rebuilding them.
  #
  # `build` and `typecheck` run in ONE graph on purpose. They are the two
  # writers of a library's `dist` — swc emits the `.js`, `tsc --build` the
  # `.d.ts` — so running them together is what would surface a regression of
  # the output collision behind #27.
  build-libs:
    name: Build libraries
    needs: initialize
    if: needs.initialize.outputs.lib-projects != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          nx-cache: build-libs
      - run: pnpm nx run-many -t build,typecheck --projects="${{ needs.initialize.outputs.lib-projects }}"
      - if: always() && env.NX_REMOTE_CACHE_NAME != ''
        uses: ./.github/actions/nx-cache-upload

  # The applications, reading the libraries above from the cache: each Next
  # application on a runner of its own, the services a few to a runner.
  # `build-libs` is skipped when no library is affected, which is not a reason
  # to skip the applications; failed or cancelled is.
  build-apps:
    name: Build (${{ matrix.chunk }})
    needs: [initialize, build-libs]
    if: >-
      always() &&
      needs.initialize.result == 'success' &&
      needs.initialize.outputs.app-chunks != '[]' &&
      (needs.build-libs.result == 'success' || needs.build-libs.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.initialize.outputs.app-chunks) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          nx-cache: build-app-${{ strategy.job-index }}
          nx-cache-from: nx-cache-build-libs
      - run: pnpm nx run-many -t build,typecheck --projects="${{ matrix.chunk }}"
      - if: always() && env.NX_REMOTE_CACHE_NAME != ''
        uses: ./.github/actions/nx-cache-upload

  # No `needs: build`: Vitest resolves the `@r10c/source` condition to each
  # package's source, so a test reads no `dist`.
  test:
    name: Test (${{ matrix.chunk }})
    needs: initialize
    if: needs.initialize.outputs.test-chunks != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.initialize.outputs.test-chunks) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          nx-cache: test-${{ strategy.job-index }}
      # Coverage is gated at 100% for `packages/*`; the plain `test` target does
      # not collect it, so CI asks for it explicitly.
      - run: pnpm nx run-many -t test --projects="${{ matrix.chunk }}" --coverage
      - if: always() && env.NX_REMOTE_CACHE_NAME != ''
        uses: ./.github/actions/nx-cache-upload

  # The services' journeys, which need no browser and no build: each suite
  # starts its service from source. One job — every suite is seconds long, and
  # a runner apiece would spend most of its time starting.
  e2e-services:
    name: E2E services
    needs: initialize
    if: needs.initialize.outputs.e2e-service-projects != ''
    runs-on: ubuntu-latest
    env:
      # The hermetic profile: the app and the service under test are real, and
      # everything they talk to is a fake wired in at the transport boundary. No
      # minikube, no Mongo, no config-service — none of which exist on a runner.
      # See the @entifix/testing-e2e README.
      E2E_PROFILE: mock
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          nx-cache: e2e-services
      - run: pnpm nx run-many -t e2e --projects="${{ needs.initialize.outputs.e2e-service-projects }}"
      - if: always() && env.NX_REMOTE_CACHE_NAME != ''
        uses: ./.github/actions/nx-cache-upload

  # The Playwright journeys, one job per application, each reading its build
  # from the cache.
  e2e-browser:
    name: E2E browser (${{ matrix.project }})
    needs: [initialize, build-apps]
    if: >-
      always() &&
      needs.initialize.result == 'success' &&
      needs.initialize.outputs.e2e-browser-projects != '[]' &&
      (needs.build-apps.result == 'success' || needs.build-apps.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.initialize.outputs.e2e-browser-projects) }}
    env:
      E2E_PROFILE: mock
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          nx-cache: e2e-browser-${{ strategy.job-index }}
          nx-cache-from: nx-cache-build-*
      - uses: ./.github/actions/playwright-browser
      - run: pnpm nx run ${{ matrix.project }}:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: apps/*-e2e/test-output/playwright
          retention-days: 7
      - if: always() && env.NX_REMOTE_CACHE_NAME != ''
        uses: ./.github/actions/nx-cache-upload

  storybook:
    name: Storybook build and accessibility
    needs: initialize
    if: needs.initialize.outputs.storybook-projects != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          nx-cache: storybook
      - run: pnpm nx run-many -t build-storybook --projects="${{ needs.initialize.outputs.storybook-projects }}"
      # A green build proves nothing about rendering or accessibility: every
      # story is rendered in Chromium and audited by axe (ADR 0075).
      - uses: ./.github/actions/playwright-browser
      - run: pnpm nx run-many -t test-a11y --projects="${{ needs.initialize.outputs.storybook-projects }}"
      - if: always() && env.NX_REMOTE_CACHE_NAME != ''
        uses: ./.github/actions/nx-cache-upload

  # The run's Nx cache, saved for the next run: what this run restored and
  # wrote, pruned to the entries some job actually used, so a cache restored
  # and saved run after run does not grow without bound. A pull request saves
  # into its own scope, so its next push starts from here; `main`'s entry is
  # what every pull request without one falls back to.
  #
  # Not in `Done`'s `needs`: a cache that failed to save costs the next run
  # time, never this run its verdict.
  save-cache:
    name: Save the Nx cache
    needs:
      [
        initialize,
        lint,
        build-libs,
        build-apps,
        test,
        e2e-services,
        e2e-browser,
        storybook,
      ]
    if: always() && needs.initialize.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To delete this ref's previous entry; a cache key cannot be overwritten.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/ci
      - uses: actions/cache/restore@v6
        with:
          key: nx-remote-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: nx-remote-${{ runner.os }}-
          path: .nx-remote/entries
      - uses: actions/download-artifact@v8
        with:
          pattern: nx-cache-*
          path: .nx-remote/entries
          merge-multiple: true
      - name: Prune to what this run used
        run: |
          set -euo pipefail
          mkdir -p .nx-remote/entries "$RUNNER_TEMP/journals"
          find .nx-remote/entries -maxdepth 1 -name 'journal-*' -exec mv {} "$RUNNER_TEMP/journals/" \;
          node tools/ci/nx-remote-cache.mjs prune .nx-remote/entries "$RUNNER_TEMP"/journals/*
          echo "saving $(find .nx-remote/entries -type f | wc -l) entries ($(du -sh .nx-remote/entries | cut -f1))"
      - uses: actions/cache/save@v6
        with:
          key: nx-remote-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: .nx-remote/entries
      # One entry per scope. Dependabot's token is read-only on a pull request,
      # so this fails there; `cache_cleanup.yml` removes what it leaves behind
      # when the pull request closes.
      - name: Delete this ref's older entries
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: nx-remote-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" \
            --key "nx-remote-$RUNNER_OS-" --limit 100 --json id,key \
            --jq ".[] | select(.key != \"$KEEP\") | .id" \
            | while read -r id; do
                gh cache delete "$id" --repo "$GITHUB_REPOSITORY"
              done

  # The single required check. A job absent from `needs` reports its own status
  # on the PR but cannot block a merge — the i18n catalog check spent its first
  # release in exactly that state, red and advisory. Every new job belongs here.
  #
  # `initialize` is listed although every other job already needs it: when it
  # fails the rest are `skipped`, not `failed`, and a gate that only looked for
  # failures would pass a run in which nothing ran.
  done:
    name: Done
    needs:
      [
        initialize,
        lint,
        assertions,
        build-libs,
        build-apps,
        test,
        e2e-services,
        e2e-browser,
        storybook,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every required job succeeded or was skipped
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
