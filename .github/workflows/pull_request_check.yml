name: Pull Request Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_chunk_size:
        description: 'Projects per test worker'
        required: false
        default: '10'
      build_chunk_size:
        description: 'Projects per build worker'
        required: false
        default: '10'

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TEST_CHUNK_SIZE: ${{ github.event.inputs.test_chunk_size || '10' }}
  BUILD_CHUNK_SIZE: ${{ github.event.inputs.build_chunk_size || '10' }}

jobs:
  initialize:
    name: Initialize
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.shas.outputs.base }}
      head: ${{ steps.shas.outputs.head }}
      test-chunks: ${{ steps.chunks.outputs.test-chunks }}
      build-chunks: ${{ steps.chunks.outputs.build-chunks }}
      e2e-projects: ${{ steps.chunks.outputs.e2e-projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9'
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies (primes/reuses pnpm store cache)
        run: pnpm install --frozen-lockfile
      - name: Resolve affected base/head
        id: shas
        uses: nrwl/nx-set-shas@v4
      - name: Compute affected chunks
        id: chunks
        run: |
          # `tail -n1` is load-bearing: pnpm prints its warnings to STDOUT, so
          # anything it has to say (a deprecated setting, a peer-dependency
          # complaint) lands in front of the JSON and `jq` dies on it —
          # `Invalid numeric literal at line 1, column 6`, which is `[WARN`.
          # Both matrices then expand from an empty string and fail before they
          # produce a job, so the run shows a red gate with no build or test job
          # to point at. nx prints the array as a single last line.
          affected() {
            pnpm nx show projects --affected \
              --base=${{ steps.shas.outputs.base }} \
              --head=${{ steps.shas.outputs.head }} \
              --withTarget "$1" --json | tail -n1
          }
          chunk() {
            jq -c --argjson n "$2" '[range(0; length; $n) as $i | .[$i:$i+$n] | join(",")]' <<<"$1"
          }

          echo "test-chunks=$(chunk "$(affected test)" "$TEST_CHUNK_SIZE")" >> "$GITHUB_OUTPUT"
          echo "build-chunks=$(chunk "$(affected build)" "$BUILD_CHUNK_SIZE")" >> "$GITHUB_OUTPUT"
          # e2e is one job, not a matrix: there are only a handful of these
          # projects and each one pays for a browser download.
          echo "e2e-projects=$(affected e2e | jq -r 'join(",")')" >> "$GITHUB_OUTPUT"

  # The cheap static checks, in one job: a separate runner for any of them would
  # spend ~35s of its 37s on checkout + install to run a 2s script.
  #
  # NOTE: this job must stay unconditional. The catalog and documentation checks
  # are deliberately NOT affected-gated — a catalog key and a documentation
  # claim are shared by every app, so a wrong one is everyone's problem
  # regardless of which project the PR touched. Only the nx lint command below
  # is affected-scoped. Adding an `if:` here would silently make all of them
  # conditional.
  lint:
    name: Lint, i18n catalogs & docs
    needs: initialize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9'
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: nx affected -t lint
        run: |
          pnpm nx affected -t lint \
            --base=${{ needs.initialize.outputs.base }} \
            --head=${{ needs.initialize.outputs.head }}
      # `always()` on every step below, so one failure does not hide the next —
      # otherwise a PR carrying several spends a round trip learning about them
      # one at a time. The job still fails if any step does.
      - name: Check es/en catalog parity
        if: always()
        run: node tools/check-i18n.mjs

      # The other i18n direction: parity says nothing about a code missing from
      # *both* locales, and the render path casts the typed-key gate away, so an
      # uncataloged code reaches the user as its own identifier.
      - name: Check every emitted error code is cataloged
        if: always()
        run: pnpm nx test @r10c/i18n-check

      # Stories are in no tsconfig project, so `typecheck` never sees them and
      # only the Storybook build does. Without this a `Loading` story that
      # throws at render still satisfies the loading-contract spec, which can
      # only see that the export exists. Affected-scoped: `entifix-react-controls`
      # is the one project declaring the target.
      - name: Build Storybook
        if: always()
        run: |
          pnpm nx affected -t build-storybook \
            --base=${{ needs.initialize.outputs.base }} \
            --head=${{ needs.initialize.outputs.head }}

      # The generated documentation blocks: the port table, the store register
      # and the ADR index are written from source, so a hand-edit or a stale
      # block fails here.
      - name: Check generated documentation blocks
        if: always()
        run: node tools/sync-docs.mjs --check

      # The assertions over hand-written prose: link and anchor targets, the
      # router tables, entity names, tag dimensions, fleet ports, and that every
      # ADR supersession was recorded on both records.
      - name: Check documentation claims
        if: always()
        run: pnpm nx test @r10c/docs-check

      # Advisory. Reports code that changed without its documentation being
      # touched, into the job summary. Never blocks: this can only see that a
      # doc was not edited, not that it is wrong, and failing on it would teach
      # everyone to make a trivial edit to whatever file it names.
      - name: Report documentation staleness
        if: always()
        continue-on-error: true
        run: |
          node tools/docs/staleness.mjs \
            --base=${{ needs.initialize.outputs.base }} \
            --head=${{ needs.initialize.outputs.head }}

  # `build` and `typecheck` run in ONE graph on purpose. They are the two
  # writers of a library's `dist` — swc emits the `.js`, `tsc --build` the
  # `.d.ts` — so running them together is what would surface a regression of
  # the output collision behind #27. Typechecking in CI at all is new: it used
  # to run only on developer machines, which is why that issue went unnoticed.
  build:
    name: Build (${{ matrix.chunk }})
    needs: initialize
    if: needs.initialize.outputs.build-chunks != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.initialize.outputs.build-chunks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9'
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: nx run-many -t build,typecheck
        run: pnpm nx run-many -t build,typecheck --projects="${{ matrix.chunk }}"

  test:
    name: Test (${{ matrix.chunk }})
    needs: initialize
    if: needs.initialize.outputs.test-chunks != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.initialize.outputs.test-chunks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9'
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: nx run-many -t test --coverage
        run: pnpm nx run-many -t test --projects="${{ matrix.chunk }}" --coverage

  e2e:
    name: E2E (mock profile)
    needs: initialize
    if: needs.initialize.outputs.e2e-projects != ''
    runs-on: ubuntu-latest
    env:
      # The hermetic profile: the app and the service under test are real, and
      # everything they talk to is a fake wired in at the transport boundary. No
      # minikube, no Mongo, no config-service — none of which exist on a runner.
      # See packages/entifix/ts/testing-e2e/README.md.
      E2E_PROFILE: mock
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9'
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve the Playwright version
        id: playwright
        run: |
          VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Chromium only: the mock profile intercepts through `page.route()`, which
      # behaves identically across engines, so the other two would triple the
      # runtime to re-assert the same traffic. Cross-browser rendering is a
      # `live` concern.
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: nx run-many -t e2e
        run: |
          pnpm nx run-many -t e2e \
            --projects="${{ needs.initialize.outputs.e2e-projects }}"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/*-e2e/test-output/playwright
          retention-days: 7

  # The single required check. A job absent from `needs` reports its own status
  # on the PR but cannot block a merge — the i18n catalog check spent its first
  # release in exactly that state, red and advisory. Every new job belongs here.
  ci-gate:
    name: CI Gate
    needs: [lint, build, test, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
