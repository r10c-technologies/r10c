version: 2
updates:
  - package-ecosystem: 'npm' # pnpm workspace, root manifest covers all packages/*
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    ignore:
      # `pnpm nx migrate latest` owns these pins and bumps them as a set Nx has
      # tested together, with codemods. Dependabot moving one in isolation breaks
      # the set: PR #63 raised typescript 6.0.3 -> 7.0.2, and TypeScript 7 is the
      # Go-native rewrite whose JS API drops `ts.readConfigFile`,
      # `ts.ScriptTarget` and `ts.ModifierFlags`. @nx/js/typescript calls all
      # three while building the project graph, so every `nx` command failed and
      # nothing in the PR could be salvaged.
      - dependency-name: 'typescript'
      - dependency-name: 'typescript-eslint'
      - dependency-name: '@typescript-eslint/*'
      - dependency-name: '@swc/*'
      - dependency-name: '@swc-node/*'
      - dependency-name: 'vite'
      - dependency-name: 'vitest'
      - dependency-name: '@vitest/*'
      - dependency-name: 'next'
      - dependency-name: 'eslint-config-next'
      - dependency-name: 'webpack*'
      - dependency-name: 'nx'
      - dependency-name: '@nx/*'
      - dependency-name: 'verdaccio'
      # Effect majors and minors arrive through entifix, never here first. Every
      # @entifix/* package peers on one `effect` line and pins the @effect/*
      # packages it was built against, so leaving the line is a migration in
      # entifix before it is a bump here. Effect 4 went that way (#285, #290,
      # #291 and #293 could not merge; r10c moved with entifix 0.2.0). 4.1 is
      # held there outright: #496 offered effect 4.1.0 alone, which broke every
      # service bundle, and the migration it needed found 4.1's cluster engine
      # resuming a signalled wait about two seconds late now and then. Patches
      # on the current line still come through.
      - dependency-name: 'effect'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@effect/*'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      # The drivers entifix pins exactly move with entifix too: a second
      # `mongodb` beside @entifix/mongo's makes every `Db` handed across the
      # seam a type error, which is what this repository's own catch-up found.
      - dependency-name: 'mongodb'
      - dependency-name: 'amqplib'
      - dependency-name: 'jose'
      # OpenTelemetry 3 is held until it can move as one set (#426). The 2.12
      # SDK packages peer on `@opentelemetry/api` `<1.10.0`; `@effect/opentelemetry`
      # 4.0.6 and entifix's service shell both peer on the 2.x SDK and on the
      # 0.223 exporters; and `sdk-trace-base` 3 is not released. A bump into any
      # of these passes CI only because pnpm does not fail an install on a peer
      # mismatch, which is how #422-#425 and #436 arrived green. The override in
      # `pnpm-workspace.yaml` pins the API for the same reason. Lift all three
      # rules, and that override, in the PR that adopts OTel 3.
      - dependency-name: '@opentelemetry/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@opentelemetry/api'
        versions: ['>=1.10.0']
      - dependency-name: '@opentelemetry/exporter-*'
        versions: ['>=0.224.0']
    groups:
      # entifix releases on fixed versioning, so its 23 packages move as one PR
      # or not at all. Grouped first so no other group claims a member. It is
      # also what keeps dependabot-core#14339 away from this catalog: that bug
      # drops the catalog entries an update does *not* touch from the lock, and
      # a group that bumps every @entifix/* entry leaves none untouched. The
      # lock is regenerated before merge regardless (DEVELOPING.md → Dependency
      # updates). `0.x` breaks on the minor, so minors are not excluded here.
      entifix:
        patterns: ['@entifix/*']
      # Every `@effect/*` package is released alongside, and peers on, the
      # matching `effect`, so the family moves as one PR or not at all.
      effect:
        patterns: ['effect', '@effect/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      # Majors are deliberately excluded: a grouped major PR cannot be bisected,
      # so one dead member hides every healthy one (#63 was 55 updates behind a
      # single broken bump). Ungrouped, a red check names the package.
      #
      # The named groups above are excluded by pattern too: otherwise a type
      # group can take some of a family before its own group does, as entifix's
      # first Dependabot run did, splitting effect 4.0.7 across three pull
      # requests that each mismatched the family when merged alone.
      dev-dependencies:
        dependency-type: 'development'
        update-types: ['minor', 'patch']
        exclude-patterns:
          [
            '@entifix/*',
            'effect',
            '@effect/*',
            'react',
            'react-dom',
            '@types/react',
            '@types/react-dom',
          ]
      production-dependencies:
        dependency-type: 'production'
        update-types: ['minor', 'patch']
        exclude-patterns:
          [
            '@entifix/*',
            'effect',
            '@effect/*',
            'react',
            'react-dom',
            '@types/react',
            '@types/react-dom',
          ]
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
