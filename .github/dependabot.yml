version: 2
updates:
  - package-ecosystem: 'npm' # pnpm workspace, root manifest covers all packages/*
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    ignore:
      # `pnpm nx migrate latest` owns these pins and bumps them as a set Nx has
      # tested together, with codemods. Dependabot moving one in isolation breaks
      # the set: PR #63 raised typescript 6.0.3 -> 7.0.2, and TypeScript 7 is the
      # Go-native rewrite whose JS API drops `ts.readConfigFile`,
      # `ts.ScriptTarget` and `ts.ModifierFlags`. @nx/js/typescript calls all
      # three while building the project graph, so every `nx` command failed and
      # nothing in the PR could be salvaged.
      - dependency-name: 'typescript'
      - dependency-name: 'typescript-eslint'
      - dependency-name: '@typescript-eslint/*'
      - dependency-name: '@swc/*'
      - dependency-name: '@swc-node/*'
      - dependency-name: 'vite'
      - dependency-name: 'vitest'
      - dependency-name: '@vitest/*'
      - dependency-name: 'next'
      - dependency-name: 'eslint-config-next'
      - dependency-name: 'webpack*'
      - dependency-name: 'nx'
      - dependency-name: '@nx/*'
      - dependency-name: 'verdaccio'
    groups:
      # entifix releases on fixed versioning, so its 23 packages move as one PR
      # or not at all. Grouped first so no other group claims a member. It is
      # also what keeps dependabot-core#14339 away from this catalog: that bug
      # drops the catalog entries an update does *not* touch from the lock, and
      # a group that bumps every @entifix/* entry leaves none untouched. The
      # lock is regenerated before merge regardless (DEVELOPING.md → Dependency
      # updates). `0.x` breaks on the minor, so minors are not excluded here.
      entifix:
        patterns: ['@entifix/*']
      # `@effect/sql*` must stay aligned with the pinned `@effect/platform`, so
      # the family moves as one PR or not at all.
      effect:
        patterns: ['effect', '@effect/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      # Majors are deliberately excluded: a grouped major PR cannot be bisected,
      # so one dead member hides every healthy one (#63 was 55 updates behind a
      # single broken bump). Ungrouped, a red check names the package.
      dev-dependencies:
        dependency-type: 'development'
        update-types: ['minor', 'patch']
      production-dependencies:
        dependency-type: 'production'
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
