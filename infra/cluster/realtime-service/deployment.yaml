# realtime-service in a cluster (ADR 0072). Written now, applied by nothing:
# no environment runs in a cluster yet. CI validates it against the Kubernetes
# schemas so the shape is right on the day it first is.
#
# The drain is three parts, in order. `preStop` holds the pod while the
# endpoint is removed from the Service, so no new stream lands on it; SIGTERM
# then closes the SSE adapter's scope, which sends every open stream a fresh
# randomized `retry:` and ends it inside its 5 s drain window; and the grace
# period outlasts both, so the kubelet never SIGKILLs a pod still draining. A
# rolling restart therefore spreads its reconnects instead of landing them on
# one replica at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-service
  labels:
    app: realtime-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: realtime-service
  template:
    metadata:
      labels:
        app: realtime-service
    spec:
      # preStop (10 s) + the drain window (5 s) + headroom.
      terminationGracePeriodSeconds: 30
      containers:
        - name: realtime-service
          image: r10c/realtime-service:latest
          ports:
            - name: http
              containerPort: 3191
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          # Distinct on purpose: liveness asks "is the process wedged?" and
          # restarts it; readiness asks "can it serve?" and only takes it out
          # of the Service. A broker outage must fail the second, never the
          # first, or every replica restarts at once and every stream drops.
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '512Mi'
              cpu: '500m'
