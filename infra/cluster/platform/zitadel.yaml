# The identity provider (ADR 0016, ADR 0083 §3): Zitadel in the cluster, its
# database in Cloud SQL. Zitadel itself is stateless; what it writes at first
# init beyond its database is the two machine users' personal access tokens.
#
# Differences from the lab's (infra/local/zitadel), each on purpose:
#
# - The database is Cloud SQL's private address, which only the cloud knows:
#   `ZITADEL_DATABASE_POSTGRES_HOST` comes from the `cloud-endpoints`
#   ConfigMap the up command writes from `tofu output sql_private_address`
#   (#685). Cloud SQL accepts encrypted connections only (`ssl_mode =
#   ENCRYPTED_ONLY` in infra/gcp/sql.tf), so both users connect `require`.
# - The public domain is the same ConfigMap's, served over HTTPS on 443 with
#   TLS ended at the edge, so the container itself serves plain HTTP.
# - The outgoing-HTTP denylist allows one range the default denies: the
#   cluster's Service range, `10.30.0.0/20` (infra/gcp/network.tf). Zitadel
#   calls auth-service back for a back-channel logout and a user-lifecycle
#   event at its Service address, which the default's `10.0.0.0/8` refuses to
#   register at all. Everything else stays denied, the pod and node ranges
#   included (`zitadel-config` below; `tools/infra` checks the list).
# - The PATs land on a small `retained` volume rather than an `emptyDir`, so a
#   pod restarted after first init still holds them; the `pat-reader` sidecar
#   stays, because the image is distroless and the seed step reads the token
#   through it (#683, #685).
#
# This tag and the hosted login's in `zitadel-login.yaml` are ONE tag, and the
# same one the lab runs: `pnpm nx test @r10c/docs-check` fails the build when
# any of the four disagree.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zitadel
  labels:
    app: zitadel
spec:
  replicas: 1
  # One ReadWriteOnce volume for the PATs: a rolling update would wait forever
  # for the old pod to let go of it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zitadel
  template:
    metadata:
      labels:
        app: zitadel
    spec:
      # Kubernetes injects a legacy env var per Service in the namespace, and
      # the Service named `zitadel` produces `ZITADEL_PORT=tcp://…`, which
      # Zitadel reads as its own listen port and dies on.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zitadel
          image: ghcr.io/zitadel/zitadel:v4.16.2
          # start-from-init is idempotent: it initialises the instance on an
          # empty database and only serves on one that already has it.
          args:
            - start-from-init
            - --config
            - /config/zitadel.yaml
            - --masterkeyFromEnv
            - --tlsMode
            - external
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: machinekey
              mountPath: /machinekey
            - name: config
              mountPath: /config
              readOnly: true
          # ZITADEL_MASTERKEY, both database passwords and the first-instance
          # admin password; their values are #683's.
          envFrom:
            - secretRef:
                name: zitadel-secret
          env:
            - name: ZITADEL_DATABASE_POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: cloud-endpoints
                  key: SQL_PRIVATE_ADDRESS
            - name: ZITADEL_DATABASE_POSTGRES_PORT
              value: '5432'
            - name: ZITADEL_DATABASE_POSTGRES_DATABASE
              value: zitadel
            - name: ZITADEL_DATABASE_POSTGRES_USER_USERNAME
              value: zitadel
            - name: ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE
              value: require
            - name: ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME
              value: postgres
            - name: ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE
              value: require
            - name: ZITADEL_EXTERNALDOMAIN
              valueFrom:
                configMapKeyRef:
                  name: cloud-endpoints
                  key: IDENTITY_DOMAIN
            - name: ZITADEL_EXTERNALPORT
              value: '443'
            - name: ZITADEL_EXTERNALSECURE
              value: 'true'
            - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME
              value: zitadel-admin
            # The seed's machine user and the hosted login's, exactly as in
            # the lab; see infra/local/zitadel/deployment.yaml for why each
            # token is extracted rather than configured.
            - name: ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME
              value: r10c-seed
            - name: ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME
              value: r10c seed
            - name: ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE
              value: '2100-01-01T00:00:00Z'
            - name: ZITADEL_FIRSTINSTANCE_PATPATH
              value: /machinekey/seed.pat
            - name: ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME
              value: login-client
            - name: ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME
              value: r10c login client
            - name: ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE
              value: '2100-01-01T00:00:00Z'
            - name: ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH
              value: /machinekey/login-client.pat
          # First init runs every migration behind an open socket, so the
          # startup probe gives it minutes before liveness may restart it.
          startupProbe:
            httpGet:
              path: /debug/healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /debug/healthz
              port: http
            periodSeconds: 20
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /debug/ready
              port: http
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: '256Mi'
              cpu: '250m'
            limits:
              memory: '768Mi'
              cpu: '750m'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: pat-reader
          image: busybox:1.36
          command: ['sh', '-c', 'sleep infinity']
          volumeMounts:
            - name: machinekey
              mountPath: /machinekey
              readOnly: true
          resources:
            requests:
              memory: '8Mi'
              cpu: '5m'
            limits:
              memory: '16Mi'
              cpu: '20m'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: machinekey
          persistentVolumeClaim:
            claimName: zitadel-machinekey
        - name: config
          configMap:
            name: zitadel-config
---
# Zitadel's own config file, for the one setting env cannot carry reliably
# (viper's indexed lists): the upstream default denylist with `10.0.0.0/8`
# split around the Service range, so auth-service's callbacks register and
# nothing else private does. The lab's equivalent is
# infra/local/zitadel/config.yaml, which allows the host instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zitadel-config
data:
  zitadel.yaml: |
    HTTPClient:
      DenyList:
        - localhost
        - '0.0.0.0/8'
        - '10.0.0.0/12'
        - '10.16.0.0/13'
        - '10.24.0.0/14'
        - '10.28.0.0/15'
        - '10.30.16.0/20'
        - '10.30.32.0/19'
        - '10.30.64.0/18'
        - '10.30.128.0/17'
        - '10.31.0.0/16'
        - '10.32.0.0/11'
        - '10.64.0.0/10'
        - '10.128.0.0/9'
        - '100.64.0.0/10'
        - '127.0.0.0/8'
        - '169.254.0.0/16'
        - '172.16.0.0/12'
        - '198.18.0.0/15'
        - '::/128'
        - '::1/128'
        - 'fc00::/7'
        - 'fe80::/10'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zitadel-machinekey
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: retained
  resources:
    requests:
      # pd-balanced's minimum; the tokens are a few hundred bytes.
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: zitadel
  labels:
    app: zitadel
spec:
  selector:
    app: zitadel
  ports:
    - name: http
      port: 8080
      targetPort: http
