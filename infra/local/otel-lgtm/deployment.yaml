apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-lgtm
  labels:
    app: otel-lgtm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-lgtm
  template:
    metadata:
      labels:
        app: otel-lgtm
    spec:
      containers:
        # Grafana's all-in-one OpenTelemetry backend: OTel Collector + Loki +
        # Tempo + Prometheus + Grafana in one container. The local mirror of
        # Grafana Cloud — same LogQL/PromQL/TraceQL — so what is validated here
        # ports to production unchanged. Dev-only: storage is ephemeral (no PVC),
        # data resets on restart.
        - name: otel-lgtm
          image: grafana/otel-lgtm:0.29.1
          ports:
            - name: grafana
              containerPort: 3000
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          env:
            # Frictionless dev access: no Grafana login, anonymous admin, so the
            # UI and HTTP API are reachable without credentials.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: 'true'
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: 'true'
          volumeMounts:
            # The dashboard JSON, at a path the image does not use. Grafana's
            # file provisioner reads only *.json here, so the provider yaml the
            # same ConfigMap projects alongside it is ignored. Do NOT narrow
            # this with `items:` to tidy that away — the subPath mount below
            # resolves against this same projection, and an items-filtered
            # volume turns it into an empty *directory* named
            # r10c-dashboards.yaml inside Grafana's provisioning dir.
            - name: dashboards
              mountPath: /etc/grafana/r10c-dashboards
              readOnly: true
            # ⚠️ `subPath`, and that is the whole trick. The image already
            # provisions three dashboards from this directory
            # (grafana-dashboards.yaml: RED classic, RED native, JVM) and four
            # datasources from the one beside it — which is where the
            # `prometheus` uid every panel names comes from. A ConfigMap volume
            # mounted at a DIRECTORY replaces that directory, so the obvious
            # mount would delete the image's dashboards in order to add ours,
            # and the same mistake on datasources/ would delete the uid. Both
            # are invisible in the manifest diff and surface as "Datasource
            # prometheus was not found" on a dashboard that provisioned fine.
            # A subPath mount grafts one file in beside them.
            - name: dashboards
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/r10c-dashboards.yaml
              subPath: r10c-dashboards.yaml
              readOnly: true
          # The image starts five servers in sequence and the OTLP/HTTP receiver
          # is not first. Probing the port the fleet exports to keeps the whole
          # container out of `readyReplicas` until traces are actually accepted.
          readinessProbe:
            tcpSocket:
              port: otlp-http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              memory: '512Mi'
              cpu: '250m'
            limits:
              memory: '1536Mi'
              cpu: '1000m'
      volumes:
        # Generated with a content hash (see kustomization.yaml), so editing a
        # panel rolls this pod and the new JSON is provisioned at boot. Nothing
        # about the dashboard lives in the ephemeral store the restart wipes.
        - name: dashboards
          configMap:
            name: otel-lgtm-dashboards
