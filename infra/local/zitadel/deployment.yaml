apiVersion: apps/v1
kind: Deployment
metadata:
  name: zitadel
  labels:
    app: zitadel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zitadel
  template:
    metadata:
      labels:
        app: zitadel
    spec:
      # Kubernetes injects a legacy env var per Service in the namespace, so the
      # Service named `zitadel` produces `ZITADEL_PORT=tcp://10.x.x.x:8080` — and
      # Zitadel reads `ZITADEL_PORT` as its own listen port. The container then
      # dies at boot with `'Port' cannot parse value as 'uint16'`, after running
      # every migration, which reads like a database problem and is not one.
      enableServiceLinks: false
      initContainers:
        # Zitadel's init needs Postgres reachable; wait for it before starting.
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z postgres 5432; do echo 'waiting for postgres'; sleep 2; done"
      containers:
        - name: zitadel
          # Pinned, not `:latest`. An identity provider that silently changes
          # version under a running fleet changes how sign-in behaves, and a
          # floating tag makes "it worked yesterday" unreproducible.
          image: ghcr.io/zitadel/zitadel:v4.16.2
          # start-from-init: bootstrap schema/first-instance then serve.
          # --masterkeyFromEnv reads ZITADEL_MASTERKEY (from the secret).
          args:
            - start-from-init
            - --masterkeyFromEnv
            - --tlsMode
            - disabled
            # Only one setting lives in here — the outgoing-HTTP denylist that
            # would otherwise refuse the back-channel logout URI. See the file.
            - --config
            - /config/zitadel.yaml
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: machinekey
              mountPath: /machinekey
            - name: config
              mountPath: /config
              readOnly: true
          # Secret supplies ZITADEL_MASTERKEY, the DB passwords, and the
          # first-instance admin password.
          envFrom:
            - secretRef:
                name: zitadel-secret
          env:
            # --- Non-secret config (safe to version) ---
            - name: ZITADEL_DATABASE_POSTGRES_HOST
              value: postgres
            - name: ZITADEL_DATABASE_POSTGRES_PORT
              value: '5432'
            - name: ZITADEL_DATABASE_POSTGRES_DATABASE
              value: zitadel
            - name: ZITADEL_DATABASE_POSTGRES_USER_USERNAME
              value: zitadel
            - name: ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE
              value: disable
            - name: ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME
              value: postgres
            - name: ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE
              value: disable
            # Reachable from the host via the 30080 NodePort, plain HTTP.
            - name: ZITADEL_EXTERNALDOMAIN
              value: localhost
            - name: ZITADEL_EXTERNALPORT
              value: '30080'
            - name: ZITADEL_EXTERNALSECURE
              value: 'false'
            - name: ZITADEL_TLS_ENABLED
              value: 'false'
            - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME
              value: zitadel-admin
            # A machine user whose personal access token the seed rung uses to
            # create the project, the OIDC app, the login policy and the SMTP
            # provider. Zitadel generates the token and writes it to PATPATH on
            # first init; `ensure.sh` copies it out of the pod. There is no way
            # to pin the value in advance, which is why it is extracted rather
            # than configured.
            - name: ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME
              value: r10c-seed
            - name: ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME
              value: r10c seed
            - name: ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE
              value: '2100-01-01T00:00:00Z'
            - name: ZITADEL_FIRSTINSTANCE_PATPATH
              value: /machinekey/seed.pat
            # A second machine user, this one for the v2 hosted login container:
            # Zitadel creates it with the IAM_LOGIN_CLIENT role and writes its
            # PAT beside the seed's. The L6 rung copies it into the
            # `zitadel-login-secret` the login pod mounts.
            #
            # Every `FIRSTINSTANCE_*` key above and below fires ONLY when the
            # instance is created. An instance that predates these lines never
            # grows the user, and the fix is `pnpm run <app>:dev:reset` — there
            # is no in-place upgrade path and this lab does not want one.
            - name: ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME
              value: login-client
            - name: ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME
              value: r10c login client
            - name: ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE
              value: '2100-01-01T00:00:00Z'
            - name: ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH
              value: /machinekey/login-client.pat
          # Process-level, so a wedged instance is restarted; `/debug/healthz`
          # answers as soon as the HTTP server is up.
          livenessProbe:
            httpGet:
              path: /debug/healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          # The one that matters to the ladder. Zitadel accepts TCP from the
          # moment the container starts and spends ~1min initialising its
          # instance behind that open socket, so without this `readyReplicas`
          # would green-light a fleet that cannot yet serve a single login.
          readinessProbe:
            httpGet:
              path: /debug/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              memory: '256Mi'
              cpu: '250m'
            limits:
              memory: '768Mi'
              cpu: '750m'
        # The Zitadel image is distroless — no shell, no `cat`, no `tar` — so
        # neither `kubectl exec` nor `kubectl cp` can read the token it writes.
        # This sidecar exists only to share that volume and be exec-able, which
        # is how the L6 rung gets the PAT onto the host.
        - name: pat-reader
          image: busybox:1.36
          command: ['sh', '-c', 'sleep infinity']
          volumeMounts:
            - name: machinekey
              mountPath: /machinekey
              readOnly: true
          resources:
            requests:
              memory: '4Mi'
              cpu: '1m'
            limits:
              memory: '32Mi'
              cpu: '50m'
      volumes:
        # Deliberately an emptyDir: both PATs written here (the seed's and the
        # login client's) belong to one instance, and an instance never outlives
        # its Postgres database. All of it is recreated together by `reset.sh`.
        - name: machinekey
          emptyDir: {}
        # The generator keeps this name stable (no content hash), so editing
        # `config.yaml` does NOT roll the pod on its own — follow the edit with
        # `kubectl -n marketplace-local-infra rollout restart deploy/zitadel`.
        - name: config
          configMap:
            name: zitadel-config
