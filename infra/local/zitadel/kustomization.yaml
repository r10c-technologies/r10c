apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: marketplace-local-infra
resources:
  - deployment.yaml
  - service.yaml
secretGenerator:
  - name: zitadel-secret
    envs:
      - .env
configMapGenerator:
  - name: zitadel-config
    files:
      - zitadel.yaml=config.yaml
generatorOptions:
  disableNameSuffixHash: true
