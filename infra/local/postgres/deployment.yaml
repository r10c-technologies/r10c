apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  # One ReadWriteOnce volume, so the old pod must be gone before the new one
  # starts — see the note in mongodb/deployment.yaml.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          # POSTGRES_USER / POSTGRES_PASSWORD come from postgres-secret.
          # Zitadel connects as this superuser to self-init its own db + user.
          envFrom:
            - secretRef:
                name: postgres-secret
          env:
            # Keep PGDATA in a subdir so the volume's lost+found doesn't clash.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          # First boot runs initdb, and a crash recovery replays WAL — both keep
          # the port shut well after the container starts. `pg_isready` is the
          # only check that distinguishes "starting up" from "accepting".
          readinessProbe:
            exec:
              command:
                ['sh', '-c', 'pg_isready -q -U "$POSTGRES_USER" -d postgres']
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              memory: '128Mi'
              cpu: '150m'
            limits:
              memory: '512Mi'
              cpu: '500m'
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
