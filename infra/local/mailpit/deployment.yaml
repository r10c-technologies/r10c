apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels:
    app: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      containers:
        - name: mailpit
          # Pinned like every other image in the lab: a mail sink that changes
          # its API under the e2e suite is a debugging session nobody asked for.
          image: axllent/mailpit:v1.30.6
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          env:
            # Deliberately in-memory: the inbox is scratch data, it must not
            # survive a reset, and it must never need a PVC (which would drag in
            # the `strategy: Recreate` problem every other stateful workload has).
            - name: MP_MAX_MESSAGES
              value: "500"
            - name: MP_SMTP_AUTH_ACCEPT_ANY
              value: "true"
            - name: MP_SMTP_AUTH_ALLOW_INSECURE
              value: "true"
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          # Protocol-level, per the rule every deployment here follows: a
          # published NodePort answering TCP says nothing about the SMTP
          # listener being up, and Zitadel dials SMTP at send time.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"
