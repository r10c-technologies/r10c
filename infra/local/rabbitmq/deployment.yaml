apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: marketplace-local-infra
  labels:
    app: rabbitmq
spec:
  replicas: 1
  # One ReadWriteOnce volume (the Mnesia dir) — see mongodb/deployment.yaml.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          # ⚠️ **Pinned to a patch, not a major.** This was `3-management`, a
          # floating tag — so "which broker does the lab run" had no answer, a
          # re-pull could move the version under a machine that changed nothing,
          # and ADR 0030's claim about "the 3.13 broker the lab runs" was only
          # ever true of whatever was last pulled. An exact tag makes the
          # upgrade a commit.
          #
          # 4.3 is the release that separates `acquired-count` from
          # `delivery-count`: the delivery limit now counts only deliveries that
          # actually failed, so a message returned for any other reason stops
          # eating the poison budget (#181). Nothing here requeues for another
          # reason yet, which is why this was a backlog item rather than a
          # prerequisite.
          image: rabbitmq:4.3.5-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          envFrom:
            - secretRef:
                name: rabbitmq-secret
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
          # Readiness is an AMQP question, not a TCP one. RabbitMQ's node boots
          # in ~20-40s and kube-proxy accepts a connection to the NodePort long
          # before the 5672 listener exists, so without this probe the pod reads
          # Ready while a client still gets "Socket closed abruptly during
          # opening handshake" — and a service that dials RabbitMQ at boot dies.
          readinessProbe:
            exec:
              command:
                ['rabbitmq-diagnostics', '-q', 'check_port_listener', '5672']
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              memory: '256Mi'
              cpu: '250m'
            limits:
              memory: '512Mi'
              cpu: '500m'
      volumes:
        - name: rabbitmq-data
          persistentVolumeClaim:
            claimName: rabbitmq-pvc
