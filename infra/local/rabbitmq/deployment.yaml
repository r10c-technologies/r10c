apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: marketplace-local-infra
  labels:
    app: rabbitmq
spec:
  replicas: 1
  # One ReadWriteOnce volume (the Mnesia dir) — see mongodb/deployment.yaml.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          envFrom:
            - secretRef:
                name: rabbitmq-secret
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
          # Readiness is an AMQP question, not a TCP one. RabbitMQ's node boots
          # in ~20-40s and kube-proxy accepts a connection to the NodePort long
          # before the 5672 listener exists, so without this probe the pod reads
          # Ready while a client still gets "Socket closed abruptly during
          # opening handshake" — and a service that dials RabbitMQ at boot dies.
          readinessProbe:
            exec:
              command:
                ['rabbitmq-diagnostics', '-q', 'check_port_listener', '5672']
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              memory: '256Mi'
              cpu: '250m'
            limits:
              memory: '512Mi'
              cpu: '500m'
      volumes:
        - name: rabbitmq-data
          persistentVolumeClaim:
            claimName: rabbitmq-pvc
