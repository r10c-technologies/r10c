packages:
  - 'apps/*'
  - 'packages/business/ts/*'
  - 'packages/utils/ts/*'
  - 'packages/utils/react/*'
  # Implementation cells: `<key>/<tech>`, one domain or store wired to one
  # technology (docs/adr/0060).
  - 'packages/implementation/*/*'
  - 'packages/shells/next/*'
  # The effect services' shared composition: r10c's grants, crossing and
  # token issuer applied to the framework's service shell.
  - 'packages/shells/effect/*'
  # Test data, never shipped: `type:testing`, so only specs, e2e and Storybook
  # may import it.
  - 'packages/testing/*'
  # Not shipped code: checks that run against the repository's own structure.
  # `slices` is the executable form of the ADR 0020 store register; `docs` holds
  # the documentation assertions, and reads the same entity scan.
  - 'tools/slices'
  - 'tools/docs'
  # `i18n` asserts that every error code a service emits has a catalog entry.
  - 'tools/i18n'
  # `conventions` asserts the repository's own working conventions — the ones
  # that were stated in prose and skipped anyway.
  - 'tools/conventions'
  # `entifix` is the swap kit: this checkout's own entifix clone, synced over
  # the release and put back again (docs/DEVELOPING.md → "Working on entifix from
  # r10c").
  - 'tools/entifix'
# entifix is installed from the registry, at one version for every package: it
# releases on fixed versioning, so two @entifix/* at different versions is a
# combination nobody tested. Every manifest says `catalog:` and this is the only
# place a version is written. To see an unreleased entifix change here, use
# `pnpm run entifix:local` (tools/entifix) — never a link or a file: specifier.
catalog:
  '@entifix/amqp': 0.8.0
  '@entifix/authz': 0.8.0
  '@entifix/business': 0.8.0
  '@entifix/core': 0.8.0
  '@entifix/i18n': 0.8.0
  '@entifix/jwt': 0.8.0
  '@entifix/mongo': 0.8.0
  '@entifix/next-i18n': 0.8.0
  '@entifix/next-shell': 0.8.0
  '@entifix/posthog': 0.8.0
  '@entifix/react-controls': 0.8.0
  '@entifix/react-integration': 0.8.0
  '@entifix/redis': 0.8.0
  '@entifix/rest': 0.8.0
  '@entifix/service-shell': 0.8.0
  '@entifix/sql': 0.8.0
  '@entifix/static': 0.8.0
  '@entifix/style': 0.8.0
  '@entifix/testing-auth': 0.8.0
  '@entifix/testing-e2e': 0.8.0
  '@entifix/testing-unit': 0.8.0
  '@entifix/tooling': 0.8.0
  '@entifix/transactions': 0.8.0
  '@entifix/zitadel': 0.8.0
allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': false
  '@swc/core': false
  core-js: false
  core-js-pure: false
  esbuild: true
  less: false
  msgpackr-extract: false
  # Only needed to emit the browser service worker; tests use `msw/node`.
  msw: false
  nx: false
  sharp: false
  unrs-resolver: false
autoInstallPeers: true
ignoreWorkspaceRootCheck: true
overrides:
  # `autoInstallPeers` resolves an optional peer to the newest release, and
  # `@effect/opentelemetry` declares the API as one. 1.10 is outside every OTel
  # 2.12 SDK package's own range (`<1.10.0`), so it moves with the OTel 3 set
  # (#426), not on its own. `.github/dependabot.yml` holds the same line, and
  # both are lifted together.
  '@opentelemetry/api': 1.9.1
minimumReleaseAgeExclude:
  # Our own framework: a release is adopted the day it ships, and the age gate
  # exists for third-party supply chain, not for a scope this organization
  # publishes through trusted publishing.
  - '@entifix/*'
  - '@typescript-eslint/eslint-plugin@8.62.1'
  - '@typescript-eslint/parser@8.62.1'
  - '@typescript-eslint/project-service@8.62.1'
  - '@typescript-eslint/scope-manager@8.62.1'
  - '@typescript-eslint/tsconfig-utils@8.62.1'
  - '@typescript-eslint/type-utils@8.62.1'
  - '@typescript-eslint/types@8.62.1'
  - '@typescript-eslint/typescript-estree@8.62.1'
  - '@typescript-eslint/utils@8.62.1'
  - '@typescript-eslint/visitor-keys@8.62.1'
  - 'prettier@3.9.3'
  - 'tailwindcss@4.3.2'
  - 'typescript-eslint@8.62.1'
  - jose@6.2.4
  - '@posthog/core@1.45.0'
  - '@posthog/types@1.398.0'
  - posthog-js@1.407.0
