packages:
  - 'apps/*'
  - 'packages/business/ts/*'
  - 'packages/utils/ts/*'
  - 'packages/shells/next/*'
  # Not shipped code: checks that run against the repository's own structure.
  # `slices` is the executable form of the ADR 0020 store register; `docs` holds
  # the documentation assertions, and reads the same entity scan.
  - 'tools/slices'
  - 'tools/docs'
  # `i18n` asserts that every error code a service emits has a catalog entry.
  - 'tools/i18n'
  # `conventions` asserts the repository's own working conventions — the ones
  # that were stated in prose and skipped anyway.
  - 'tools/conventions'
# entifix is installed from the registry, at one version for every package: it
# releases on fixed versioning, so two @entifix/* at different versions is a
# combination nobody tested. Every manifest says `catalog:` and this is the only
# place a version is written. To see an unreleased entifix change here, run its
# `dev-sync` against this checkout (entifix README → "Developing against a
# consumer") — never a link or a file: specifier.
catalog:
  '@entifix/amqp': 0.1.1
  '@entifix/authz': 0.1.1
  '@entifix/business': 0.1.1
  '@entifix/core': 0.1.1
  '@entifix/i18n': 0.1.1
  '@entifix/jwt': 0.1.1
  '@entifix/mongo': 0.1.1
  '@entifix/next-i18n': 0.1.1
  '@entifix/next-shell': 0.1.1
  '@entifix/posthog': 0.1.1
  '@entifix/react-controls': 0.1.1
  '@entifix/react-integration': 0.1.1
  '@entifix/redis': 0.1.1
  '@entifix/rest': 0.1.1
  '@entifix/service-shell': 0.1.1
  '@entifix/sql': 0.1.1
  '@entifix/style': 0.1.1
  '@entifix/testing-auth': 0.1.1
  '@entifix/testing-e2e': 0.1.1
  '@entifix/testing-unit': 0.1.1
  '@entifix/tooling': 0.1.1
  '@entifix/transactions': 0.1.1
  '@entifix/zitadel': 0.1.1
allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': false
  '@swc/core': false
  core-js: false
  core-js-pure: false
  esbuild: true
  less: false
  msgpackr-extract: false
  # Only needed to emit the browser service worker; tests use `msw/node`.
  msw: false
  nx: false
  sharp: false
  unrs-resolver: false
autoInstallPeers: true
ignoreWorkspaceRootCheck: true
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.62.1'
  - '@typescript-eslint/parser@8.62.1'
  - '@typescript-eslint/project-service@8.62.1'
  - '@typescript-eslint/scope-manager@8.62.1'
  - '@typescript-eslint/tsconfig-utils@8.62.1'
  - '@typescript-eslint/type-utils@8.62.1'
  - '@typescript-eslint/types@8.62.1'
  - '@typescript-eslint/typescript-estree@8.62.1'
  - '@typescript-eslint/utils@8.62.1'
  - '@typescript-eslint/visitor-keys@8.62.1'
  - 'prettier@3.9.3'
  - 'tailwindcss@4.3.2'
  - 'typescript-eslint@8.62.1'
  - jose@6.2.4
  - '@posthog/core@1.45.0'
  - '@posthog/types@1.398.0'
  - posthog-js@1.407.0
  - '@entifix/amqp@0.1.1'
  - '@entifix/authz@0.1.1'
  - '@entifix/business@0.1.1'
  - '@entifix/core@0.1.1'
  - '@entifix/i18n@0.1.1'
  - '@entifix/jwt@0.1.1'
  - '@entifix/mongo@0.1.1'
  - '@entifix/next-i18n@0.1.1'
