packages:
  - 'apps/*'
  - 'packages/entifix/ts/*'
  - 'packages/business/ts/*'
  - 'packages/utils/ts/*'
  - 'packages/entifix/react/*'
  - 'packages/entifix/style'
  - 'packages/implementation/product-configuration-management/*'
  - 'packages/shells/next/*'
  - 'packages/shells/effect/*'
  # Not shipped code: checks that run against the repository's own structure.
  # `slices` is the executable form of the ADR 0020 store register; `docs` holds
  # the documentation assertions, and reads the same entity scan.
  - 'tools/slices'
  - 'tools/docs'
  # `i18n` asserts that every error code a service emits has a catalog entry.
  - 'tools/i18n'
allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': false
  '@swc/core': false
  core-js: false
  core-js-pure: false
  esbuild: true
  less: false
  msgpackr-extract: false
  # Only needed to emit the browser service worker; tests use `msw/node`.
  msw: false
  nx: false
  sharp: false
  unrs-resolver: false
# react and react-dom must resolve to the exact same version everywhere: the
# `$name` form follows whatever the root manifest declares, so a bump keeps them
# together. Without it a partial lockfile rewrite can split them — Dependabot
# #90 left `@testing-library/react` on `react-dom@19.2.8(react@19.2.7)` in the
# `entifix-ts-testing-unit` importer, whose optional `react: '*'` peer never
# moved, and React itself threw `Incompatible React versions` at test time.
overrides:
  react: $react
  react-dom: $react-dom
autoInstallPeers: true
ignoreWorkspaceRootCheck: true
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.62.1'
  - '@typescript-eslint/parser@8.62.1'
  - '@typescript-eslint/project-service@8.62.1'
  - '@typescript-eslint/scope-manager@8.62.1'
  - '@typescript-eslint/tsconfig-utils@8.62.1'
  - '@typescript-eslint/type-utils@8.62.1'
  - '@typescript-eslint/types@8.62.1'
  - '@typescript-eslint/typescript-estree@8.62.1'
  - '@typescript-eslint/utils@8.62.1'
  - '@typescript-eslint/visitor-keys@8.62.1'
  - 'prettier@3.9.3'
  - 'tailwindcss@4.3.2'
  - 'typescript-eslint@8.62.1'
  - jose@6.2.4
  - '@posthog/core@1.45.0'
  - '@posthog/types@1.398.0'
  - posthog-js@1.407.0
